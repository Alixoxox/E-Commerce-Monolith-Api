# Database setup with H2 PostgreSQL mode
spring.datasource.url=jdbc:h2:mem:ecommerce_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=VALUE,USER,USERS
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=postgres
spring.datasource.password=123

# Auto DDL
spring.jpa.hibernate.ddl-auto=create-drop

# Disable global forced quoting (causes case-sensitivity issues with double quotes in H2)
spring.jpa.properties.hibernate.globally_quoted_identifiers=false
spring.jpa.properties.hibernate.auto_quote_keyword=true

# Force Hibernate to use PostgreSQL Dialect for generation match
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Redis & RabbitMQ Exclusions
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration